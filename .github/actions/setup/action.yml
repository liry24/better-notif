name: Setup workspace
description: Install Vite+ and the pinned backing package manager
inputs:
    node-version:
        description: Node version for repository tooling
        default: '24.21.0'
runs:
    using: composite
    steps:
        - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
          with:
              version-file: package.json
              node-version: ${{ inputs.node-version }}
              run-install: false
        - shell: bash
          run: vp install --frozen-lockfile
