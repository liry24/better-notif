name: CI

on:
    push:
        branches: [main]
    pull_request:
    merge_group:
    workflow_dispatch:

permissions: {}
concurrency:
    group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
    cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
    build:
        permissions: { contents: read }
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: vp run build
            - run: mkdir artifact && cd packages/better-notif && bun pm pack --destination ../../artifact --ignore-scripts
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with: { name: 'notification-${{ github.sha }}', path: 'artifact/*.tgz', if-no-files-found: error }
    typecheck:
        permissions: { contents: read }
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: vp run typecheck
    lint:
        permissions: { contents: read }
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: vp run format:check
            - run: vp run lint
            - run: vp run workspace:check
    knip:
        permissions: { contents: read }
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: vp run unused
    unit:
        permissions: { contents: read }
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: vp run test:unit
    integration:
        permissions: { contents: read }
        strategy:
            fail-fast: false
            matrix: { os: [ubuntu-latest, windows-latest] }
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: vp run test:integration
    client:
        permissions: { contents: read }
        strategy:
            fail-fast: false
            matrix: { os: [ubuntu-latest, windows-latest] }
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: vp run test:client
    tooling-minimum:
        permissions: { contents: read }
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
              with: { node-version: '22.18.0' }
            - run: vp run check
    consumer:
        permissions: { contents: read }
        needs: build
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { package-manager: bun, better-auth: '1.7.0', runtime-node: '22.16.0' }
                    - { package-manager: bun, better-auth: '^1.7.0', runtime-node: '22' }
                    - { package-manager: bun, better-auth: '^1.7.0', runtime-node: '24.0.0' }
                    - { package-manager: bun, better-auth: '^1.7.0' }
                    - { package-manager: npm, better-auth: '^1.7.0' }
                    - { package-manager: pnpm, better-auth: '^1.7.0' }
        env:
            NOTIFICATION_PACKAGE_MANAGER: ${{ matrix.package-manager }}
            NOTIFICATION_BETTER_AUTH_VERSION: ${{ matrix.better-auth }}
            NOTIFICATION_NODE_VERSION: ${{ matrix.runtime-node }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
              with: { name: 'notification-${{ github.sha }}', path: artifact }
            - name: Resolve exact packed artifact
              shell: bash
              run: |
                  files=("$GITHUB_WORKSPACE"/artifact/*.tgz)
                  [[ ${#files[@]} == 1 && -f "${files[0]}" ]]
                  echo "NOTIFICATION_TARBALL=${files[0]}" >> "$GITHUB_ENV"
            - if: matrix.package-manager == 'pnpm'
              run: npm install --global pnpm@10.25.0
            - run: vp run test:consumer
    runtime:
        needs: build
        permissions: { contents: read }
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                node: ['22.0.0', '22.x']
                version: ['1.7.0', '^1.7.0']
        runs-on: ${{ matrix.os }}
        env:
            NOTIFICATION_BETTER_AUTH_VERSION: ${{ matrix.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with: { node-version: '${{ matrix.node }}' }
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
              with: { name: 'notification-${{ github.sha }}', path: artifact }
            - name: Resolve exact packed artifact
              shell: bash
              run: |
                  files=("$GITHUB_WORKSPACE"/artifact/*.tgz)
                  [[ ${#files[@]} == 1 && -f "${files[0]}" ]]
                  echo "NOTIFICATION_TARBALL=${files[0]}" >> "$GITHUB_ENV"
            - run: node test/runtime/packed.mjs
    ci-ok:
        if: always()
        needs: [build, typecheck, lint, knip, unit, integration, client, tooling-minimum, consumer, runtime]
        runs-on: ubuntu-latest
        steps:
            - name: Require blocking jobs
              env:
                  NEEDS: ${{ toJSON(needs) }}
              run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
