name: CI

on:
    push:
        branches: [main]
    pull_request:
    merge_group:
    workflow_dispatch:

permissions: {}
concurrency:
    group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
    cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
    build:
        permissions: { contents: read }
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: vp run build
    typecheck:
        permissions: { contents: read }
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: vp run typecheck
    lint:
        permissions: { contents: read }
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: vp run format:check
            - run: vp run lint
            - run: vp run workspace:check
    knip:
        permissions: { contents: read }
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: vp run unused
    unit:
        permissions: { contents: read }
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: vp run test:unit
    integration:
        permissions: { contents: read }
        strategy:
            fail-fast: false
            matrix: { os: [ubuntu-latest, windows-latest] }
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: vp run test:integration
    client:
        permissions: { contents: read }
        strategy:
            fail-fast: false
            matrix: { os: [ubuntu-latest, windows-latest] }
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: vp run test:client
    tooling-minimum:
        permissions: { contents: read }
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
              with: { node-version: '22.18.0' }
            - run: vp run check
    consumer:
        permissions: { contents: read }
        needs: build
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { package-manager: bun, better-auth: '1.7.0', runtime-node: '22.16.0' }
                    - { package-manager: bun, better-auth: '^1.7.0', runtime-node: '22' }
                    - { package-manager: bun, better-auth: '^1.7.0', runtime-node: '24.0.0' }
                    - { package-manager: bun, better-auth: '^1.7.0' }
                    - { package-manager: npm, better-auth: '^1.7.0' }
                    - { package-manager: pnpm, better-auth: '^1.7.0' }
        env:
            NOTIFICATION_PACKAGE_MANAGER: ${{ matrix.package-manager }}
            NOTIFICATION_BETTER_AUTH_VERSION: ${{ matrix.better-auth }}
            NOTIFICATION_NODE_VERSION: ${{ matrix.runtime-node }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - if: matrix.package-manager == 'pnpm'
              run: npm install --global pnpm@10.25.0
            - run: vp run test:consumer
    ci-ok:
        if: always()
        needs: [build, typecheck, lint, knip, unit, integration, client, tooling-minimum, consumer]
        runs-on: ubuntu-latest
        steps:
            - name: Require blocking jobs
              env:
                  NEEDS: ${{ toJSON(needs) }}
              run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
